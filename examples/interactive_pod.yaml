# Interactive DEBUG-SESSION pod: starts, installs base deps, prints
# READY_FOR_CODE, then sleeps so you can kubectl cp / exec into it.
#
# ⚠ LAB RULE: this is for short debugging sessions ONLY — delete it the same
# day. Never use a sleep-infinity pod to reserve a GPU and "start training
# later": real runs go in a Job with the command in the YAML (batch_job.yaml).
#
#   kubectl apply -f interactive_pod.yaml
#   kubectl logs my-gpu-pod | grep READY_FOR_CODE
#   kubectl cp script.py my-gpu-pod:/workspace/
#   kubectl exec my-gpu-pod -- python /workspace/script.py
#   kubectl delete pod my-gpu-pod          # ALWAYS when done
#
# Rename "my-gpu-pod" to something identifying you + the task.
apiVersion: v1
kind: Pod
metadata:
  name: my-gpu-pod
spec:
  restartPolicy: Never
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              # every free-pool product that fits your model — the scheduler
              # picks whichever node has a free card
              - key: nvidia.com/gpu.product
                operator: In
                values:
                  - NVIDIA-RTX-A6000
                  - NVIDIA-A10
                  - NVIDIA-A40
                  - NVIDIA-GeForce-RTX-3090
                  - NVIDIA-GeForce-RTX-4090
                  - NVIDIA-L40
                  - NVIDIA-L40S
                  - NVIDIA-GeForce-RTX-2080-Ti
                  - Tesla-T4
              # exclude nodes known to be broken (driver mismatch etc.)
              - key: kubernetes.io/hostname
                operator: NotIn
                values: [uicnrp-fiona2.evl.uic.edu]
  containers:
    - name: main
      image: pytorch/pytorch:2.4.0-cuda12.1-cudnn9-runtime
      command: ["/bin/bash", "-lc"]
      args:
        - |
          set -euo pipefail
          echo "=== node: $(hostname) ==="; nvidia-smi -L
          pip install -q nvidia-ml-py numpy 'transformers==4.46.3' 'accelerate==1.1.1'
          mkdir -p /workspace /output
          echo "READY_FOR_CODE — kubectl cp your code into /workspace and exec it"
          sleep infinity
      env:
        - name: HF_HOME
          value: /output/hf_cache      # move to a PVC path if you have one
      resources:
        # Nautilus policy: requests must equal limits (ratio <= 1.2)
        limits:
          nvidia.com/gpu: "1"
          cpu: "4"
          memory: 16Gi
        requests:
          nvidia.com/gpu: "1"
          cpu: "4"
          memory: 16Gi
      volumeMounts:
        - {name: workspace, mountPath: /workspace}
        - {name: output, mountPath: /output}
  volumes:
    - {name: workspace, emptyDir: {}}
    - {name: output, emptyDir: {}}     # swap for a PVC to keep results (see pvc.yaml)
